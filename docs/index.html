<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Ops Kit</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    :root {
      --bg: #070b14;
      --panel: #101827;
      --line: rgba(148, 163, 184, 0.18);
      --text: #e8eef8;
      --muted: #94a3b8;
      --teal: #2dd4bf;
      --gold: #e4c38a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(45, 212, 191, 0.12), transparent 50%),
        radial-gradient(900px 400px at 90% 0%, rgba(228, 195, 138, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
    header { text-align: center; }
    .logo {
      width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 20px 0 8px; font-size: 2rem; letter-spacing: -0.03em; }
    .tag { color: var(--muted); margin: 0 0 20px; }
    .lang {
      display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 4px;
      background: rgba(16, 24, 39, 0.8);
    }
    .lang button {
      border: 0; background: transparent; color: var(--muted);
      padding: 8px 16px; border-radius: 999px; cursor: pointer; font: inherit;
    }
    .lang button.active { background: var(--teal); color: #042f2e; font-weight: 600; }
    .badges { margin: 22px 0 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .badge {
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted);
    }
    .card {
      margin-top: 36px; padding: 24px; border: 1px solid var(--line);
      border-radius: 18px; background: rgba(16, 24, 39, 0.72);
    }
    h2 { margin: 0 0 14px; font-size: 1.1rem; color: var(--gold); }
    .layers { display: grid; gap: 12px; }
    .layer {
      display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start;
      padding: 14px; border-radius: 14px; background: rgba(7, 11, 20, 0.55);
    }
    .n {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
      font-weight: 700; color: #042f2e; background: var(--teal);
    }
    .layer:nth-child(2) .n { background: var(--gold); }
    .layer:nth-child(3) .n { background: #7dd3fc; }
    .layer p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
    ul { margin: 0; padding-left: 1.1rem; color: var(--muted); }
    li { margin: 6px 0; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .links a {
      color: var(--teal); text-decoration: none; border: 1px solid var(--line);
      padding: 8px 12px; border-radius: 10px;
    }
    footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="assets/logo.png" alt="Hermes Ops Kit">
      <h1>Hermes Ops Kit</h1>
      <p class="tag" data-i18n="tag"></p>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-zh" onclick="setLang('zh')">简体中文</button>
        <button type="button" id="btn-en" onclick="setLang('en')">English</button>
      </div>
      <div class="badges">
        <span class="badge">v0.4-preview</span>
        <span class="badge">plan-only</span>
        <span class="badge">MIT</span>
      </div>
    </header>

    <section class="card">
      <h2 data-i18n="layersTitle"></h2>
      <div class="layers">
        <div class="layer"><div class="n">1</div><div><strong data-i18n="l1t"></strong><p data-i18n="l1d"></p></div></div>
        <div class="layer"><div class="n">2</div><div><strong data-i18n="l2t"></strong><p data-i18n="l2d"></p></div></div>
        <div class="layer"><div class="n">3</div><div><strong data-i18n="l3t"></strong><p data-i18n="l3d"></p></div></div>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="nextTitle"></h2>
      <ul>
        <li data-i18n="n1"></li>
        <li data-i18n="n2"></li>
        <li data-i18n="n3"></li>
      </ul>
      <div class="links">
        <a href="../README.md" data-i18n="aZh"></a>
        <a href="../README.en.md">English README</a>
        <a href="clone-and-run.md" data-i18n="aUse"></a>
        <a href="bestnative-integration.md">BestNative</a>
      </div>
    </section>

    <footer data-i18n="foot"></footer>
  </div>
  <script>
    const copy = {
      zh: {
        tag: "给 Hermes Agent 用的本地优先 AI SRE 契约与 Runbook 模板包。不是 Hermes 功能分支，也不是 BestNative。",
        layersTitle: "三层边界",
        l1t: "Local Hermes",
        l1d: "本机运行时 copilot。真实环境和真实操作留在 ~/.hermes，不在本仓库。",
        l2t: "Hermes Ops Kit（本仓库）",
        l2d: "可脱敏发布的合同：env-map、catalog、巡检 JSON、Runbook、审批 schema。公开侧 plan-only。",
        l3t: "BestNative",
        l3d: "未来独立控制面。先做 BestNative 仓库，再只读本 kit，不要把适配器写进这里。",
        nextTitle: "接下来",
        n1: "clone 后先 make check，再复制 env-map.local.yaml。",
        n2: "公开 inspect 只出合同形状；真实只读检查走私有 overlay。",
        n3: "BestNative 尚未打通。下一步是独立仓 + HERMES_OPS_KIT_PATH 只读。",
        aZh: "中文 README",
        aUse: "使用流程",
        foot: "GitHub 仓库首页用 README 顶部的「简体中文 / English」切换语言。"
      },
      en: {
        tag: "A local-first AI SRE contract and runbook kit for Hermes Agent. Not a Hermes feature branch, and not BestNative.",
        layersTitle: "Three layers",
        l1t: "Local Hermes",
        l1d: "Your runtime copilot. Real environments and actions stay in ~/.hermes, not this repo.",
        l2t: "Hermes Ops Kit (this repo)",
        l2d: "Publishable contracts: env-map, catalog, inspection JSON, runbooks, approval schema. Public side is plan-only.",
        l3t: "BestNative",
        l3d: "A future separate control plane. Build that repo first, then read this kit. Do not put the adapter here.",
        nextTitle: "Next",
        n1: "After clone, run make check, then copy env-map.local.yaml.",
        n2: "Public inspect emits contract-shaped output; real read-only checks live in a private overlay.",
        n3: "BestNative is not integrated. Next: a separate repo plus a read-only HERMES_OPS_KIT_PATH.",
        aZh: "Chinese README",
        aUse: "How to use",
        foot: "On GitHub, switch language with 简体中文 / English at the top of the README."
      }
    };
    function setLang(lang) {
      const t = copy[lang] || copy.zh;
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t[el.getAttribute("data-i18n")] || "";
      });
      document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
      localStorage.setItem("hok-lang", lang);
    }
    const saved = localStorage.getItem("hok-lang");
    const start = (saved === "en" || saved === "zh")
      ? saved
      : ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
    setLang(start);
  </script>
</body>
</html>
