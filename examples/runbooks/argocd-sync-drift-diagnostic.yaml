name: argocd-sync-drift-diagnostic
title: ArgoCD sync drift read-only diagnostic
category: cicd
risk_level: L0
requires_approval: false
requires_backup: false
supports_env: [dev, test]
mode: read-only
related_skills:
  - argocd-ops
  - k8s-env-map
  - safe-operations
inputs:
  - name: env
    required: true
    description: Environment name from env-map.
  - name: app_alias
    required: false
    description: Optional ArgoCD application alias filter.
prechecks:
  - Verify env exists in env-map.
  - Verify kubeconfig path exists without printing its content.
  - If an ArgoCD component is declared, verify it is not disabled.
execution:
  - Read application sync and health status.
  - List OutOfSync, Degraded, or Missing applications as aliases only.
  - Do not sync, prune, rollback, or patch Application objects.
rollback: Not required for read-only mode.
verification:
  - Result lists drifted application aliases or an explicit all-synced conclusion.
outputs:
  - inspection_result
  - incident_doc
