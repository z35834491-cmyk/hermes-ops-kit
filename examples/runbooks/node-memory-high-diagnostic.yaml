name: node-memory-high-diagnostic
title: Node memory high read-only diagnostic
category: k8s
risk_level: L0
requires_approval: false
requires_backup: false
supports_env: [dev, test]
mode: read-only
related_skills:
  - k8s-env-map
  - safe-operations
inputs:
  - name: env
    required: true
    description: Environment name from env-map.
  - name: node_alias
    required: false
    description: Optional node alias filter. Do not use raw hostnames in public artifacts.
prechecks:
  - Verify env exists in env-map.
  - Verify kubeconfig path exists without printing its content.
execution:
  - Read node memory usage against the catalog threshold.
  - List pods on high-memory nodes as aliases only.
  - Do not cordon, drain, delete, or restart nodes or pods.
rollback: Not required for read-only mode.
verification:
  - Result lists nodes above the memory threshold or an explicit none-above-threshold conclusion.
outputs:
  - inspection_result
  - incident_doc
