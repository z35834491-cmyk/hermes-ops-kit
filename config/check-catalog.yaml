version: "0.1"

checks:
  k8s_nodes_ready:
    component: k8s
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: k8s
    title: K8s nodes readiness
  pod_abnormal:
    component: k8s
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: k8s
    title: Abnormal pods
  warning_events:
    component: k8s
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: k8s
    title: Warning events
  pvc_status:
    component: k8s
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: k8s
    title: PVC status
  high_restart:
    component: k8s
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: k8s
    title: High restart pods
    threshold: 10
  node_resource_top:
    component: k8s
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: k8s
    title: Node resource top
    memory_threshold_percent: 85
  argocd_sync:
    component: argocd
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: k8s
    title: ArgoCD sync
    optional: true
  longhorn_health:
    component: longhorn
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: k8s
    title: Longhorn health
    optional: true
    note: Only include this check when the environment uses Longhorn.
  mysql_replica:
    component: mysql
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: mysql
    title: MySQL replica status
  redis_health:
    component: redis
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: redis
    title: Redis health
  rabbitmq_stale_queues:
    component: rabbitmq
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: rabbitmq
    title: RabbitMQ stale queues
  elasticsearch_health:
    component: elasticsearch
    risk_level: L0
    mode: read-only
    requires_approval: false
    checker: elasticsearch
    title: Elasticsearch health
